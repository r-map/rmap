; PlatformIO Project Configuration File
;

[platformio]
default_envs =
	     lolin_s3_mini

[env]
framework = arduino
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.03.30/platform-espressif32.zip
lib_extra_dirs = ../../libraries/
monitor_speed = 115200
lib_ignore = 
	ArduinoSTL
	FreeRTOS
	AESLib
	STM32duino LwIP
	STM32duino FreeRTOS
	arduino_uip
	RF24
	RF24Network
	UIPEthernet
	GSM_GPRSLibrary
	freertos-cpp
	Sqlite3Esp32

build_flags = 
	-Iinclude
	-fexceptions
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	;;-DCONFIG_DISABLE_HAL_LOCKS=1
	    
[env:lolin_s3_mini]
board = lolin_s3_mini

