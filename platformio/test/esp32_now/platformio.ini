; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_c3_mini
;	wemos_d1_mini32

[env]
framework = arduino
;platform = espressif32
; devel
;platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.03.30/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

monitor_speed = 115200
upload_speed = 921600
;lib_deps = Adafruit NeoPixel
;lib_deps = seeed-studio/Seeed Arduino rpcBLE
    
[env:wemos_d1_mini32]
board = wemos_d1_mini32

[env:lolin_c3_mini]
board = lolin_c3_mini

[env:lolin_s3_mini]
board = lolin_s3_mini

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
