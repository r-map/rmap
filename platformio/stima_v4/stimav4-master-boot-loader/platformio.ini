; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir= ../../custom_boards

[env]
platform = ststm32@17.3.0
framework = arduino
lib_extra_dirs = 
	../libraries
lib_ldf_mode = deep
lib_archive = no
monitor_speed = 115200
board_build.variants_dir = ../../custom_variants
platform_packages =
		  framework-arduinoststm32 @ https://github.com/r-map/Arduino_Core_STM32_stima_v4.git#2.7.1_stima_v4

[env:stimav4_master_boot]
; Same MCU board as master app, but flash at 0x08000000 (no app offset 0xB000)
board = stimav4_master
board_build.ldscript = $PROJECT_DIR/user_custom/bootloader.ld
board_build.flash_offset = 0x0
board_upload.offset_address = 0x08000000
build_flags = 
	-DINIT_PARAMETER=false
	-fpermissive
	-DVERSION_MAJOR=1
	-DVERSION_MINOR=2
	-DREVISION=0
	-DNODE_NAME=\"stima4.master\"
	-DNODE_NAME_PREFIX=\"stima4\"
	-DHAL_TIM_MODULE_DISABLED
	-DVECT_TAB_OFFSET=0x0
	-w
	-I include
	-std=c++11